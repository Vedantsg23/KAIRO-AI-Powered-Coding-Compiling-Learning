<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="KAIRO: AI-powered coding, compiling and learning. Real compilers for 32 languages in a sandbox, live diagnostics and Saarthi, the AI guide." />
    <meta name="theme-color" content="#f3f6f4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable app (see src/pwa/install.tsx and public/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KAIRO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KAIRO · Compiler OS</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. KAIRO's
      // signal (light) theme is the default; dark is the student's choice.
      try {
        if (localStorage.getItem("cd.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0a");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
